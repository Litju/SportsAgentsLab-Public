name: Public Security And License Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Setup uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: 0.10.1
      - name: Install dependency metadata
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify license policy
        shell: bash
        run: |
          grep -F "SportsAgentsLab Proprietary Source-Available License" LICENSE
          grep -F "Copyright Julio Rodriguez 2026" LICENSE
          ! grep -Eiq '(^|[^A-Za-z])(MIT|Apache|BSD|GPL|AGPL) License' LICENSE
          python source-release/scripts/verify_public_tree.py --public-root .
      - name: Dependency audit and SBOM
        run: |
          pnpm test:vulnerabilities
          python scripts/generate_sbom.py
      - name: Secret scan
        run: python scripts/secret_scan.py
