name: Docs and assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - run: python scripts/verify_asset_manifest.py
      - run: python scripts/verify_public_source_boundary.py
