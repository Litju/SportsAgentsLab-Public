name: Build SportsAgentsLab Public Source Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release operation
        required: true
        default: audit
        type: choice
        options:
          - audit
          - build
          - scan
          - test
          - diff
          - publish-pr
          - release-receipt
      publish:
        description: Explicitly authorize public branch and PR publication
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-source-release-v1
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.mode != 'publish-pr' && inputs.mode != 'release-receipt' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout private release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/public-source-release-v1
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run release operation
        run: python source-release/scripts/build_public_tree.py --mode "${{ inputs.mode }}"

  publish:
    if: ${{ inputs.mode == 'publish-pr' && inputs.publish == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_SOURCE_RELEASE_TOKEN }}
    steps:
      - name: Checkout private release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: work/public-source-release-v1
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Clone public repository
        run: gh repo clone Litju/SportsAgentsLab-Public "$RUNNER_TEMP/SportsAgentsLab-Public"
      - name: Build and publish public pull request
        run: >-
          python source-release/scripts/publish_public_pr.py
          --repo .
          --public-repo "$RUNNER_TEMP/SportsAgentsLab-Public"
          --publish
