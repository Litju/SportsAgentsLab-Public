name: MEF Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mef-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: MEF Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      MEF_REQUIRE_NODE24: "1"
      MEF_REQUIRE_POSTGRES: "1"
      MEF_CI_NO_PAID_MODEL_CALLS: "1"
      MEF_DATABASE_ADMIN_URL: postgresql://postgres:CHANGE_ME@127.0.0.1:5432/mef_test
      DATABASE_MIGRATION_URL: postgresql://mef_migration:CHANGE_ME@127.0.0.1:5432/mef_test
      DATABASE_AUTH_URL: postgresql://mef_migration:CHANGE_ME@127.0.0.1:5432/mef_test
      MEF_DATABASE_URL: postgresql://mef_migration:CHANGE_ME@127.0.0.1:5432/mef_test
      MEF_DATABASE_RUNTIME_URL: postgresql://mef_runtime:CHANGE_ME@127.0.0.1:5432/mef_test
      MEF_MIGRATION_PASSWORD: CHANGE_ME
      MEF_RUNTIME_PASSWORD: CHANGE_ME
      MEF_PUBLIC_SOURCE_RELEASE: ${{ github.repository == 'Litju/SportsAgentsLab-Public' && '1' || '0' }}
      MEF_SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      MEF_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MEF_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    services:
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_PASSWORD: CHANGE_ME
          POSTGRES_DB: mef_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mef_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: uv.lock

      - name: Setup uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          version: 0.10.1

      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(pnpm --version)" = "9.15.4"
          test "$(python --version)" = "Python 3.12.6"
          uv --version | grep -E '^uv 0\.10\.1($| )'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Python workspace
        run: uv sync --all-packages --locked

      - name: Activate locked Python workspace
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Prepare isolated PostgreSQL roles
        run: pnpm --filter @mef/operational-state run ci:prepare-db

      - name: Apply operational migrations
        run: pnpm --filter @mef/operational-state run ci:migrate

      - name: Apply Better Auth migration
        run: pnpm --filter @mef/practitioner-web run migrate:auth

      - name: Grant runtime database privileges
        run: pnpm --filter @mef/operational-state run ci:grant-runtime

      - name: Run merge-blocking validation
        run: pnpm ci:validate

      - name: Upload non-secret CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mef-quality-gate-evidence
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 7
