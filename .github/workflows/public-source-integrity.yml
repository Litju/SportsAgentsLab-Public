name: Public Source Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify public tree
        run: python source-release/scripts/verify_public_tree.py --public-root .
      - name: Secret scan
        run: python source-release/scripts/scan_secrets.py --root .
      - name: PII scan
        run: python source-release/scripts/scan_pii.py --root .
      - name: Local metadata scan
        run: python source-release/scripts/scan_local_metadata.py --root .
      - name: Third-party rights scan
        run: python source-release/scripts/scan_third_party.py --root .
      - name: Held-out evaluation scan
        run: python source-release/scripts/scan_heldout.py --root .
