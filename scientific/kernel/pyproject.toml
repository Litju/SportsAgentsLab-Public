[project]
name = "mef-scientific-kernel"
version = "0.1.0"
description = "Independently runnable scientific-kernel boundary for MEF."
requires-python = "==3.12.6"
dependencies = [
  "mef-generated-models"
]

[tool.uv.sources]
mef-generated-models = { workspace = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mef_scientific_kernel"]
