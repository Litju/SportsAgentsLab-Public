<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Scientific computation and AI</title><desc id="desc">AI organizes context and explanations while deterministic software performs numeric calculations.</desc>
<rect width="900" height="430" fill="#f8fafc" /><text x="40" y="55" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">Scientific computation and AI</text><g font-family="Arial, sans-serif" text-anchor="middle"><rect x="80" y="125" width="290" height="190" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3" /><rect x="530" y="125" width="290" height="190" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3" /><g fill="#0f172a" font-size="20"><text x="225" y="170" font-weight="700">AI interaction</text><text x="225" y="215" font-size="16">organizes context</text><text x="225" y="242" font-size="16">explains evidence</text><text x="225" y="269" font-size="16">surfaces uncertainty</text><text x="675" y="170" font-weight="700">Deterministic code</text><text x="675" y="215" font-size="16">validates inputs</text><text x="675" y="242" font-size="16">calculates values</text><text x="675" y="269" font-size="16">records units</text></g><path d="M370 220h160" stroke="#64748b" stroke-width="4" /><path d="M520 212l14 8-14 8z" fill="#64748b" /></g></svg>
