<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Agents and responsibilities</title><desc id="desc">Five specialized agents have separate questions and responsibilities.</desc>
<rect width="900" height="500" fill="#111827" /><text x="40" y="55" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="700">Agents and responsibilities</text><g font-family="Arial, sans-serif" font-size="17"><g fill="#0e7490"><rect x="55" y="105" width="235" height="110" rx="12" /><rect x="332" y="105" width="235" height="110" rx="12" /><rect x="609" y="105" width="235" height="110" rx="12" /></g><g fill="#7c3aed"><rect x="194" y="285" width="235" height="110" rx="12" /><rect x="471" y="285" width="235" height="110" rx="12" /></g><g fill="white" text-anchor="middle"><text x="172" y="148">Measurement Agent</text><text x="172" y="177" fill="#cffafe">what was measured?</text><text x="449" y="148">Research Agent</text><text x="449" y="177" fill="#cffafe">what is established?</text><text x="726" y="148">Monitoring Agent</text><text x="726" y="177" fill="#cffafe">how is it changing?</text><text x="311" y="328">Prescription Agent</text><text x="311" y="357" fill="#ede9fe">what options fit?</text><text x="588" y="328">Marketing Agent</text><text x="588" y="357" fill="#ede9fe">how is it communicated?</text></g></g></svg>
